<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620"><rect width="760" height="620" rx="28" fill="#fff"/><g font-family="Space Grotesk,Arial"><text x="54" y="68" font-size="14" font-weight="700" fill="#653593">CAPABILITY STACK</text><text x="54" y="98" font-size="12" fill="#657087">Readiness is strongest when every layer has evidence.</text><g transform="translate(75 150)"><rect x="0" y="280" width="610" height="70" rx="12" fill="#f3edf9" stroke="#653593"/><text x="30" y="322" font-size="20" font-weight="700" fill="#101638">01 · Technical foundation</text><text x="405" y="322" font-size="12" fill="#657087">concepts + methodology</text><rect x="35" y="195" width="540" height="70" rx="12" fill="#fff1e2" stroke="#ef7700"/><text x="65" y="237" font-size="20" font-weight="700" fill="#101638">02 · Tool execution</text><text x="382" y="237" font-size="12" fill="#657087">repeatable engineering flow</text><rect x="70" y="110" width="470" height="70" rx="12" fill="#f3edf9" stroke="#653593"/><text x="100" y="152" font-size="20" font-weight="700" fill="#101638">03 · Debug evidence</text><text x="360" y="152" font-size="12" fill="#657087">failure → cause → fix</text><rect x="105" y="25" width="400" height="70" rx="12" fill="#fff1e2" stroke="#ef7700"/><text x="135" y="67" font-size="20" font-weight="700" fill="#101638">04 · Review + ownership</text></g><g fill="#653593" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700"><text x="585" y="205">EVIDENCE</text><text x="585" y="290">EVIDENCE</text><text x="585" y="375">EVIDENCE</text></g></g></svg>
