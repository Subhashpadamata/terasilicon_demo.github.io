<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420">
<rect width="1000" height="420" rx="4" fill="#ffffff" stroke="#d6d0c7"/>
<text x="55" y="58" font-family="Arial, sans-serif" font-size="17" letter-spacing="3.5" fill="#ff7a00">PROPERTY-DRIVEN VERIFICATION</text>

<g font-family="Arial, sans-serif">
 <rect x="55" y="105" width="250" height="220" fill="#f7f5ef" stroke="#d6d0c7"/>
 <text x="82" y="145" font-size="22" font-weight="700" fill="#111936">DESIGN INTENT</text>
 <text x="82" y="185" font-size="15" fill="#69728b">• Protocol rules</text>
 <text x="82" y="215" font-size="15" fill="#69728b">• Safety conditions</text>
 <text x="82" y="245" font-size="15" fill="#69728b">• Ordering requirements</text>
 <text x="82" y="275" font-size="15" fill="#69728b">• Reset behavior</text>

 <rect x="375" y="105" width="250" height="220" fill="#111936"/>
 <text x="402" y="145" font-size="22" font-weight="700" fill="#ffffff">SVA</text>
 <text x="402" y="185" font-size="15" fill="#d8dbea">assert property (...)</text>
 <text x="402" y="215" font-size="15" fill="#d8dbea">assume property (...)</text>
 <text x="402" y="245" font-size="15" fill="#d8dbea">cover property (...)</text>
 <text x="402" y="285" font-size="14" fill="#ff7a00">Executable verification intent</text>

 <rect x="695" y="105" width="250" height="220" fill="#f7f5ef" stroke="#d6d0c7"/>
 <text x="722" y="145" font-size="22" font-weight="700" fill="#111936">RESULT</text>
 <text x="722" y="185" font-size="15" fill="#69728b">PROVED — requirement holds</text>
 <text x="722" y="225" font-size="15" fill="#69728b">FAILED — counterexample</text>
 <text x="722" y="265" font-size="15" fill="#69728b">COVERED — scenario reachable</text>
</g>
<g fill="none" stroke="#ff7a00" stroke-width="3">
 <path d="M305 215 H375"/>
 <path d="M625 215 H695"/>
</g>
</svg>