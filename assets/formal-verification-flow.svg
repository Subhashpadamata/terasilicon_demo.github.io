<text x="690" y="261" font-family="Arial, sans-serif" font-size="14" fill="#d8dbea">Counterexample analysis</text>
<text x="690" y="288" font-family="Arial, sans-serif" font-size="14" fill="#ff7a00">Exhaustive reasoning</text>

