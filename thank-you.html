<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="refresh" content="5;url=https://tsiqdeeptechlab.com/">
<title>Thank You | TSIQ Deep Tech Lab</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=2">
<link rel="shortcut icon" type="image/png" href="favicon.png?v=2">
<link rel="apple-touch-icon" href="favicon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#101536;--purple:#6333a9;--orange:#f47a00;--muted:#5f6c84;--line:#ddd3e9;--max:1440px}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{min-height:100vh;background:linear-gradient(135deg,#f2ebf8 0%,#fff 48%,#fff0df 100%);font-family:"Space Grotesk",sans-serif;color:var(--ink)}
a{color:inherit;text-decoration:none}
/* Compact branded header using the supplied TSIQ Deep Tech Lab logo. */
.site-header{height:82px;background:#03142f;border-bottom:1px solid #14264a;display:flex;align-items:center}
.header-inner{width:min(var(--max),calc(100% - 64px));margin:0 auto;display:flex;align-items:center;height:100%}
.brand{display:inline-flex;align-items:center;min-width:0}
.brand img{width:220px;height:62px;object-fit:cover;object-position:center;display:block;border-radius:3px}
.page{min-height:calc(100vh - 82px);display:grid;place-items:center;padding:48px 24px}
.success-card{position:relative;width:min(920px,100%);padding:64px 48px 52px;text-align:center;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:10px;box-shadow:0 28px 90px rgba(16,21,54,.12);overflow:hidden;animation:cardIn .5s cubic-bezier(.2,.8,.2,1)}
.success-card:before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,var(--purple),var(--orange))}
.check{width:82px;height:82px;margin:0 auto 20px;border:2px solid var(--purple);border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--purple);font-size:40px;font-weight:700;animation:checkIn .65s ease-out}
.eyebrow{margin-bottom:13px;font:700 11px/1.2 "IBM Plex Mono",monospace;letter-spacing:.2em;color:var(--purple)}
h1{margin:0;color:var(--ink);font-size:clamp(34px,5vw,58px);line-height:1.05;letter-spacing:-.04em}
p{max-width:760px;margin:20px auto 0;color:var(--muted);font-size:17px;line-height:1.7}
.redirect-message{display:flex;align-items:center;justify-content:center;gap:18px;margin:30px auto 0;color:var(--ink);font-weight:600;min-height:76px}
.redirect-timer{position:relative;width:76px;height:76px;flex:0 0 76px}
.redirect-timer svg{width:76px;height:76px;display:block;transform:rotate(-90deg)}
.redirect-timer circle{fill:none;stroke-width:5}
.redirect-timer .track{stroke:#eadff4}
.redirect-timer .progress{stroke:var(--orange);stroke-linecap:round;stroke-dasharray:213.628;stroke-dashoffset:0;animation:countdown 5s linear forwards}
.redirect-count{position:absolute;inset:0;display:grid;place-items:center;font:700 20px/1 "IBM Plex Mono",monospace;color:var(--purple)}
.redirect-note{margin-top:12px;font-size:13px;color:#7a8498}
@keyframes countdown{to{stroke-dashoffset:213.628}}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}.confetti i{position:absolute;top:-18px;width:7px;height:15px;opacity:0;animation:fall 1.9s ease-out forwards}.confetti i:nth-child(1){left:10%;background:var(--purple);animation-delay:.02s}.confetti i:nth-child(2){left:22%;background:var(--orange);animation-delay:.14s}.confetti i:nth-child(3){left:35%;background:#8d67c3;animation-delay:.06s}.confetti i:nth-child(4){left:50%;background:var(--orange);animation-delay:.2s}.confetti i:nth-child(5){left:64%;background:var(--purple);animation-delay:.08s}.confetti i:nth-child(6){left:78%;background:var(--orange);animation-delay:.24s}.confetti i:nth-child(7){left:90%;background:#8d67c3;animation-delay:.1s}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes checkIn{0%{opacity:0;transform:scale(.55)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes fall{0%{opacity:0;transform:translateY(0) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translateY(360px) rotate(260deg)}}
@media(max-width:820px){.site-header{height:70px}.header-inner{width:calc(100% - 36px)}.brand img{width:190px;height:54px}.page{min-height:calc(100vh - 70px);padding:28px 16px}.success-card{padding:46px 22px 34px}.check{width:70px;height:70px;font-size:34px}p{font-size:15px;line-height:1.65}.redirect-message{width:100%;padding:13px 16px}}
@media(prefers-reduced-motion:reduce){.success-card,.check,.confetti i{animation:none}}
</style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="./index.html" aria-label="TSIQ Deep Tech Lab home">
      <img src="assets/images/tsiq-full-logo-transparent.png" alt="TSIQ Deep Tech Lab logo">
    </a>
  </div>
</header>
<main class="page">
  <section class="success-card" role="status" aria-live="polite">
    <div class="confetti" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="check">✓</div>
    <div class="eyebrow">SUBMISSION RECEIVED</div>
    <h1>Form submitted successfully.</h1>
    <p>Thank you for reaching out. Our team will review your details and contact you regarding the relevant opportunity or next step.</p>
    <div class="redirect-message" aria-label="Redirecting to the home page">
      <div class="redirect-timer" aria-hidden="true">
        <svg viewBox="0 0 76 76" role="presentation">
          <circle class="track" cx="38" cy="38" r="34"></circle>
          <circle class="progress" cx="38" cy="38" r="34"></circle>
        </svg>
        <span class="redirect-count" id="redirect-count">5</span>
      </div>
      <span>You are being redirected to the home page.</span>
    </div>
    <div class="redirect-note" id="redirect-note">Redirecting in 5 seconds…</div>
  </section>
</main>
<script>
(function(){
  'use strict';
  var homeUrl='https://tsiqdeeptechlab.com/';
  var seconds=5;
  var note=document.getElementById('redirect-note');
  var count=document.getElementById('redirect-count');
  var redirected=false;

  function goHome(){
    if(redirected)return;
    redirected=true;
    window.location.replace(homeUrl);
  }

  if(note){
    note.textContent='Redirecting in 5 seconds…';
  }

  var timer=window.setInterval(function(){
    seconds--;
    if(count) count.textContent=String(Math.max(seconds,0));
    if(note) note.textContent=seconds>0 ? 'Redirecting in '+seconds+' second'+(seconds===1?'':'s')+'…' : 'Redirecting now…';
    if(seconds<=0){
      window.clearInterval(timer);
      goHome();
    }
  },1000);

  // Independent fallback in case the interval is interrupted.
  window.setTimeout(goHome,5600);
})();
</script>
</body>
</html>
